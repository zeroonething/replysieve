[package]
name = "replysieve"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Judge comments in a fraction of a second: approve, reject or needs-review with a reason, from small decision models on OpenRouter. CLI, MCP server and Rust library."
repository = "https://github.com/zeroonething/replysieve"
documentation = "https://docs.rs/replysieve"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["moderation", "comments", "spam", "mcp", "openrouter"]
categories = ["command-line-utilities", "text-processing"]
include = [
    "/src/**",
    "/data/labeled.jsonl",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/NOTICE",
]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
log = "0.4.29"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
toml = "1.2.1"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
wiremock = "0.6.5"
