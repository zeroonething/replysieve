- id: US-REPLYSIEVE-0.1.0-T08
  summary: CI and release workflows, cargo-deny config, contributors script, dependabot.
  why_required: The contract requires CI on every push and PR and a gated release path.
  status: done
  depends_on:
  - US-REPLYSIEVE-0.1.0-T01
  acceptance_criteria:
  - CI runs tests, clippy, fmt and cargo-deny on every push and PR, with actions pinned to commit SHAs and read-only default permissions
  - '`cargo install replysieve` builds and runs on macOS and Linux'
  - '`cargo publish --dry-run` passes and the `cargo package --list` contents are reviewed before publishing'
  - Tag v0.1.0 matches the Cargo.toml version, and the GitHub release notes come from CHANGELOG
  files:
  - .github/workflows/ci.yml
  - .github/workflows/release.yml
  - .github/contributors.sh
  - .github/dependabot.yml
  - deny.toml
  - .gitleaks.toml
  evidence:
  - "cargo deny check \u2014 advisories ok, bans ok, licenses ok, sources ok (no ignores)"
  - "actionlint .github/workflows/*.yml \u2014 no findings; all 24 uses: lines pinned to 40-char commit SHAs taken from semlith; top-level permissions contents: read in ci.yml and release.yml; ci.yml uses no secrets"
  - 'ci.yml jobs: fmt, clippy, test (ubuntu, macos), deny, secrets (gitleaks), install (cargo install --path . then replysieve --version and offline check, ubuntu and macos), package (cargo package --list and cargo publish --dry-run). release.yml jobs: verify (tag equals Cargo.toml version, tag on main, CHANGELOG heading), test, release (notes from CHANGELOG plus contributors section), thank, publish (environment crates-io, CARGO_REGISTRY_TOKEN)'
  - "bash -n and shellcheck .github/contributors.sh \u2014 clean; render on sample data produced a Contributors section"
  - 'Subagent scratch-copy run: cargo publish --dry-run --locked exit 0 and cargo install smoke printed replysieve 0.1.0 and a too_short reject verdict; the real tree waits on T07 docs for README/CHANGELOG/licenses'
