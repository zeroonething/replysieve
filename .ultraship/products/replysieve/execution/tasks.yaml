product: replysieve
version: 0.1.0
tasks:
- id: US-REPLYSIEVE-0.1.0-T01
  summary: Crate skeleton, verdict types, levels, presets, TOML config, free pre-checks and the offline CLI check path.
  why_required: Every verdict flows through these types, and pre-checks must answer without any model call.
  status: done
  depends_on: []
  acceptance_criteria:
  - '`--preset comments|product-review|launch-thread` each load, and an unknown preset fails with a clear error and non-zero exit'
  - Too-short, stock-phrase and duplicate comments (duplicates via --recent) are rejected with no network call, verified by a test run with no API key and no network
  - A missing OPENROUTER_API_KEY gives a clear error message and non-zero exit, before any network call
  - '`#![forbid(unsafe_code)]`, clippy with -D warnings and cargo fmt --check all pass'
  files:
  - Cargo.toml
  - Cargo.lock
  - src/lib.rs
  - src/types.rs
  - src/precheck.rs
  - src/config.rs
  - src/presets.rs
  - src/main.rs
  - tests/cli_offline.rs
  evidence:
  - "cargo test \u2014 12 passed, 0 failed (5 precheck unit, 7 tests/cli_offline.rs: too_short, stock_phrase, duplicate via --recent, every preset loads, unknown preset error, missing OPENROUTER_API_KEY error before network, unknown level error)"
  - "cargo clippy --all-targets -- -D warnings \u2014 exit 0"
  - "cargo fmt --check \u2014 exit 0"
  - '#![forbid(unsafe_code)] in src/lib.rs and [lints.rust] unsafe_code = forbid in Cargo.toml'
- id: US-REPLYSIEVE-0.1.0-T02
  summary: OpenRouter connector with model-list fallback, injection guard, prompt with context and custom rules, and level decision logic.
  why_required: Without the model path no comment that passes pre-checks gets a verdict.
  status: done
  depends_on:
  - US-REPLYSIEVE-0.1.0-T01
  acceptance_criteria:
  - '`replysieve check "<text>"` prints one verdict JSON object with verdict, reason, confidence, level, model and latency_ms, and exits 0'
  - '`replysieve check --file comments.jsonl` prints one verdict JSON line per input line, in input order'
  - On the level fixtures, a generic comment is approved at light and rejected at medium and heavy, and an off-topic comment is approved at medium and rejected at heavy
  - A comment breaking a custom rule from the config file is rejected at light, medium and heavy, with the rule shown in the verdict
  - Title, description and parent-comment context inputs are passed to the model and change the heavy-level on-topic decision on the fixtures
  - Comments that try to instruct the moderator are rejected with reason injection_attempt on all injection fixtures
  - With the first configured model failing on the mocked server, the next model in the list answers; with all failing, the verdict is needs_review with reason model_unavailable
  files:
  - src/openrouter.rs
  - src/judge.rs
  - src/lib.rs
  - src/main.rs
  - src/types.rs
  - src/config.rs
  - tests/model_mock.rs
  - tests/common/mod.rs
  - Cargo.toml
  - Cargo.lock
  evidence:
  - "cargo test \u2014 27 passed, 0 failed (10 unit incl. judge levels/needs_review band/fence; 7 cli_offline; 10 tests/model_mock.rs against wiremock: one verdict JSON, 20-line batch in order, level fixtures generic light/medium/heavy and off-topic medium/heavy, custom rule rejected at all levels with rule shown, title/description/parent change heavy decision, 6 injection fixtures rejected at all levels, comment fenced as data, fallback to next model, all models failing gives needs_review model_unavailable, unreachable server gives model_unavailable)"
  - "cargo clippy --all-targets -- -D warnings \u2014 exit 0; cargo fmt --check \u2014 exit 0"
  - 'Live smoke, target/debug/replysieve check against ~typesafe/jev-latest: specific approved (useful, 1.0), heavy nonspecific rejected (not_specific, 0.61), medium generic rejected (generic, 0.98), polite injection rejected (injection_attempt, 0.98); 0.7-1.4 s per call'
  - 'Finding: OpenRouter /api/alpha/decisions returns HTTP 400 for an invalid first model even with a models list, so fallback is done client-side, model by model'
- id: US-REPLYSIEVE-0.1.0-T03
  summary: MCP server over stdio with check_comment and check_batch tools.
  why_required: Agent users (Claude Code, Codex) reach replysieve only through MCP in 0.1.0.
  status: done
  depends_on:
  - US-REPLYSIEVE-0.1.0-T02
  acceptance_criteria:
  - '`replysieve mcp` serves check_comment and check_batch over stdio, and both return the same verdict JSON as the CLI'
  files:
  - src/mcp.rs
  - src/main.rs
  - src/lib.rs
  - tests/mcp.rs
  - Cargo.toml
  - Cargo.lock
  - src/types.rs
  evidence:
  - "cargo test --test mcp \u2014 1 passed: replysieve mcp over stdio lists check_comment and check_batch; check_comment (default and level heavy) and check_batch structuredContent equal the CLI verdict JSON for the same inputs (latency_ms excluded); server exits 0 when stdin closes"
  - "cargo test \u2014 28 passed, 0 failed; cargo clippy --all-targets -- -D warnings \u2014 exit 0; cargo fmt --check \u2014 exit 0"
