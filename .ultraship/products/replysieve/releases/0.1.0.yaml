product: replysieve
version: 0.1.0
status: released
release_type: minor
outcome:
  user_can: 'Install replysieve with cargo install, run one comment or a batch through it from the CLI or from an agent over MCP, choose light, medium or heavy strictness, use a built-in preset or their own plain-English rules, and get approve, reject or needs_review with a reason and the model''s confidence from a decision model on OpenRouter.

    '
  business_value: 'Puts replysieve publicly on GitHub and crates.io under the zeroonething org, claims the name, and gives launchladder and agent users a cheap, fast way to judge comments before 0.2.0 adds the HTTP server.

    '
  evidence_of_value: 'The eval command shows, at medium on the labeled set, 95% or more of junk caught and under 5% of good comments wrongly rejected, and a real comment judged from Claude Code and from Codex over MCP returns the expected verdict.

    '
scope:
  included:
  - Rust crate that is both the library (public check API, documented on docs.rs) and the replysieve binary
  - CLI check command for one comment or a JSONL batch, printing verdict JSON (verdict, reason, confidence, level, model, latency_ms, matched rule when one fired)
  - Optional context inputs - post or product title and description, parent comment
  - Strictness levels light, medium, heavy (default medium) as defined in product.yaml
  - Built-in presets comments, product-review, launch-thread
  - Custom plain-English rules from a TOML config file, enforced at every level
  - Free pre-checks with no model call - minimum length per level, stock-phrase list, duplicates against recent texts passed by the caller
  - Injection guard - comment text sent strictly as data, plus a check that rejects text trying to instruct the moderator
  - OpenRouter connector for decision models only, API key from an environment variable, ordered model list tried in order by replysieve, default model ~typesafe/jev-latest
  - When no model answers, the verdict is needs_review with reason model_unavailable (never a silent approve)
  - MCP server over stdio exposing check_comment and check_batch tools
  - About 300 labeled example comments across reviews, Reddit-style threads, X replies and launch comments, reviewed by Aakash
  - eval command reporting junk caught and good wrongly rejected per level
  - Unit and integration tests, with the OpenRouter connector tested against a mocked server
  - README, LICENSE-MIT, LICENSE-APACHE, NOTICE, CONTRIBUTING (DCO), SECURITY, CODE_OF_CONDUCT, CHANGELOG
  - CI on GitHub Actions - tests, clippy, fmt, cargo-deny
  - Public repository github.com/zeroonething/replysieve, GitHub release v0.1.0, crates.io publish
  excluded:
  - HTTP server and Docker image (0.2.0)
  - Rule-testing workflow and platform recipes (0.3.0)
  - Homebrew, MCP registry listing, prebuilt binaries (0.4.0)
  - Providers other than OpenRouter, chat LLMs, non-English languages
  - Storing or logging comment content
  - Images or video, platform connectors, its own agent loop, hosted service, dashboard
  fallback_scope:
  - CLI check command for one comment or a JSONL batch with verdict JSON
  - Strictness levels light, medium, heavy
  - Built-in comments preset only
  - Free pre-checks and the injection guard
  - OpenRouter connector with model fallback
  - Labeled set and eval command
  - Repository, license files, CI, GitHub release and crates.io publish
acceptance:
  functional:
  - '`replysieve check "<text>"` prints one verdict JSON object with verdict, reason, confidence, level, model and latency_ms, and exits 0'
  - '`replysieve check --file comments.jsonl` prints one verdict JSON line per input line, in input order'
  - On the level fixtures, a generic comment is approved at light and rejected at medium and heavy, and an off-topic comment is approved at medium and rejected at heavy
  - '`--preset comments|product-review|launch-thread` each load, and an unknown preset fails with a clear error and non-zero exit'
  - A comment breaking a custom rule from the config file is rejected at light, medium and heavy, with the rule shown in the verdict
  - Title, description and parent-comment context inputs are passed to the model and change the heavy-level on-topic decision on the fixtures
  - Too-short, stock-phrase and duplicate comments (duplicates via --recent) are rejected with no network call, verified by a test run with no API key and no network
  - Comments that try to instruct the moderator are rejected with reason injection_attempt on all injection fixtures
  - With the first configured model failing on the mocked server, the next model in the list answers; with all failing, the verdict is needs_review with reason model_unavailable
  - A missing OPENROUTER_API_KEY gives a clear error message and non-zero exit, before any network call
  - '`replysieve mcp` serves check_comment and check_batch over stdio, and both return the same verdict JSON as the CLI'
  - '`replysieve eval` prints junk caught and good wrongly rejected for each level over the labeled set'
  - The library check function is public and documented, with a runnable doc example
  non_functional:
  - 'At medium on the labeled set with the default model: junk caught 95% or more, good wrongly rejected under 5%'
  - Pre-checks answer in under 5 ms at p99 in a benchmark on the development machine
  - No comment text is written to disk or to logs at any verbosity, verified by a test
  - '`cargo install replysieve` builds and runs on macOS and Linux'
  - '`#![forbid(unsafe_code)]`, clippy with -D warnings and cargo fmt --check all pass'
  operational:
  - README first screen covers what it is, install, a short example, and MCP setup for Claude Code and Codex
  - NOTICE reads Copyright (c) 2026 Aakash Pawar (zeroonething); Cargo.toml license is MIT OR Apache-2.0
  - CI runs tests, clippy, fmt and cargo-deny on every push and PR, with actions pinned to commit SHAs and read-only default permissions
  - 'Before the repository goes public: full-history secret scan, secret scanning with push protection, Actions approval required for first-time contributors, actions pinned to SHAs, read-only workflow permissions, no secrets on fork PRs, branch protection with force-push blocked on main and develop, publish token in an approval-gated release environment, and cargo package --list reviewed'
  - '`cargo publish --dry-run` passes and the `cargo package --list` contents are reviewed before publishing'
  - Tag v0.1.0 matches the Cargo.toml version, and the GitHub release notes come from CHANGELOG
delivery:
  target_mode: published
  environment: Public GitHub repository github.com/zeroonething/replysieve (default branch develop) and crates.io
  deployment_method: 'Tag v0.1.0, create the GitHub release with notes from CHANGELOG, then cargo publish from a release environment gated on Aakash''s approval.

    '
  migrations: []
  observability:
  - Every verdict JSON carries model, latency_ms and confidence, so callers can watch speed and model behavior
  - A --verbose flag prints timing and model-fallback events to stderr, never comment text
  rollback: 'crates.io versions cannot be deleted. A bad release is yanked with cargo yank and replaced by a fixed patch version, and the GitHub release is marked as superseded with a note pointing to the fix.

    '
dependencies:
  products: []
  services:
  - OpenRouter API with a decision model listed (default ~typesafe/jev-latest)
  - GitHub (zeroonething org, Actions)
  - crates.io
  human_approvals:
  - Aakash reviews and corrects the labeled example set
  - Aakash approves making the repository public
  - Aakash approves the crates.io publish, which is permanent
resource_profile:
  complexity: medium
  uncertainty: medium
  likely_cost_drivers:
  - Drafting and reviewing about 300 labeled examples
  - Tuning level thresholds until the accuracy target is met
  - Working out Jev's request and response shape through OpenRouter
  - OpenRouter calls during eval runs
  preferred_tools:
  - Rust stable
  - tokio, reqwest, serde, clap
  - rmcp (official Rust MCP SDK)
  - cargo-deny
  constraints:
  - Decision models only, via OpenRouter only
  - Stateless; no content stored or logged
  - English only
risks:
- Jev through OpenRouter may not return probabilities, which would make confidence thresholds unusable; then the levels lean on the chosen label and a wider needs_review band
- The accuracy target may not be reached with the default model on the labeled set
- The labeled set is drafted by Claude, so it may share its blind spots; Aakash's review is the guard
- New injection phrasings may get past the guard
- The replysieve name could be taken on crates.io before the 0.1.0 publish
open_questions:
- 'Decided by Claude, open to change: when no model answers, return needs_review with reason model_unavailable rather than an error'
