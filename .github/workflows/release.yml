name: release

# A push to main releases the version in Cargo.toml, if it is not released yet.
# Nothing is typed by hand: bump the version and the CHANGELOG on develop, merge
# develop into main, and this workflow tags, creates the GitHub release,
# publishes to crates.io and npm, and pushes the Docker image.
#
# Every output is checked before it is made (tag, GitHub release, crates.io
# version, npm version, image tag), so a push without a version bump releases
# nothing and a rerun (Actions "Re-run failed jobs", or "Run workflow" on main)
# finishes a release that stopped half way. Once the tag exists, everything is built from
# the tagged commit, never from a newer main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Each job that writes asks for exactly what it writes.
permissions:
  contents: read

# One release at a time, and never cancel one half way.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/zeroonething/replysieve

jobs:
  # What this push should release, and which parts already exist.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      minor: ${{ steps.version.outputs.minor }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      ref: ${{ steps.exists.outputs.ref }}
      release: ${{ steps.exists.outputs.release }}
      crate: ${{ steps.exists.outputs.crate }}
      npm: ${{ steps.exists.outputs.npm }}
      image: ${{ steps.exists.outputs.image }}
      retag: ${{ steps.exists.outputs.retag }}
      work: ${{ steps.exists.outputs.work }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::releases run only from main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version
        id: version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Cargo.toml version '$version' is not SemVer"
            exit 1
          fi
          npm_version=$(jq -r .version npm/package.json)
          if [[ "$npm_version" != "$version" ]]; then
            echo "::error::npm/package.json version '$npm_version' is not the Cargo.toml version '$version'"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "minor=$(cut -d. -f1,2 <<< "$version")"
            echo "prerelease=$prerelease"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Which outputs already exist
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          MINOR: ${{ steps.version.outputs.minor }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if sha=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            # Anyone with write access can create a tag; only one on main counts.
            if ! git merge-base --is-ancestor "$sha" "$GITHUB_SHA"; then
              echo "::error::tag $TAG ($sha) is not on main; delete it or bump the version"
              exit 1
            fi
            echo "tag $TAG exists at $sha on main: building from it"
            ref=$sha
          else
            ref=$GITHUB_SHA
          fi
          release=true
          gh release view "$TAG" > /dev/null 2>&1 && release=false
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'replysieve-release (https://github.com/zeroonething/replysieve)' \
            "https://crates.io/api/v1/crates/replysieve/$VERSION")
          case "$code" in
            200) crate=false ;;
            404) crate=true ;;
            *) echo "::error::crates.io answered HTTP $code; cannot tell whether $VERSION is published"; exit 1 ;;
          esac
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'replysieve-release (https://github.com/zeroonething/replysieve)' \
            "https://registry.npmjs.org/@zeroonething%2freplysieve/$VERSION")
          case "$code" in
            200) npm=false ;;
            404) npm=true ;;
            *) echo "::error::the npm registry answered HTTP $code; cannot tell whether $VERSION is published"; exit 1 ;;
          esac
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
          image=true
          docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1 && image=false
          # The version tag is pushed first and the minor tag last, so a minor
          # tag on another digest means the tagging stopped half way.
          retag=false
          if [[ "$image" == false && "$PRERELEASE" == false ]]; then
            want=$(docker buildx imagetools inspect --raw "$IMAGE:$VERSION" | sha256sum)
            have=$(docker buildx imagetools inspect --raw "$IMAGE:$MINOR" 2> /dev/null | sha256sum)
            [[ "$want" == "$have" ]] || retag=true
          fi
          work=false
          [[ "$release$crate$npm$image$retag" == *true* ]] && work=true
          {
            echo "ref=$ref"
            echo "release=$release"
            echo "crate=$crate"
            echo "npm=$npm"
            echo "image=$image"
            echo "retag=$retag"
            echo "work=$work"
          } | tee -a "$GITHUB_OUTPUT"
          if [[ "$work" == false ]]; then
            echo "::notice::$TAG is fully released (GitHub release, crates.io, npm, $IMAGE:$VERSION); nothing to do"
          fi
      - name: CHANGELOG starts with this version
        if: steps.exists.outputs.work == 'true'
        env:
          REF: ${{ steps.exists.outputs.ref }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          heading=$(git show "$REF:CHANGELOG.md" | grep -m1 '^## \[' || true)
          echo "CHANGELOG: $heading"
          case "$heading" in
            "## [$VERSION]"*) ;;
            *) echo "::error::the first CHANGELOG.md section is not [$VERSION]"; exit 1 ;;
          esac

  test:
    needs: plan
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo package --locked --list
      - run: cargo publish --dry-run --locked

  # Creates the tag on the planned commit and the release with this version's
  # CHANGELOG section, then the contributors since the previous release.
  release:
    needs: [plan, test]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.plan.outputs.ref }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          # Computed now, not in plan, so a rerun after a newer release has
          # shipped never moves "latest" back.
          highest=$( { git tag -l 'v[0-9]*' | grep -vF -e - | sed 's/^v//' || true; echo "$VERSION"; } | sort -V | tail -1)
          latest=false
          [[ "$PRERELEASE" == false && "$highest" == "$VERSION" ]] && latest=true
          echo "latest=$latest" | tee -a "$GITHUB_OUTPUT"
          awk '/^## \[/{n++; next} n==1 && !/^\[[^]]*\]:/' CHANGELOG.md > notes.md
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$REF^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            echo "contributors since $previous"
            { echo; bash .github/contributors.sh section "$previous" "$REF"; } >> notes.md
          fi
          cat notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.ref }}
          name: ${{ needs.plan.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ needs.plan.outputs.prerelease }}
          make_latest: ${{ steps.notes.outputs.latest }}

  # "Released in vX.Y.Z" on each outside contributor's pull request and the
  # issues it closed, once every part of the release exists. The script marks
  # each comment, so it runs on every push to main and posts only what is
  # missing. Its own job, so the one token that can comment holds nothing
  # else. Not for a pre-release.
  thank:
    needs: [plan, test, release, publish, npm, manifest]
    if: >-
      always() && needs.plan.result == 'success'
      && needs.plan.outputs.prerelease == 'false'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Thank contributors
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/contributors.sh thank "${{ needs.plan.outputs.tag }}"

  # Trusted publishing: a short-lived token from crates.io for this workflow
  # and environment, no stored secret. Until trusted publishing is set up for
  # the crate, the stored CARGO_REGISTRY_TOKEN in the environment is used.
  # The environment deploys only from main.
  publish:
    needs: [plan, test]
    if: needs.plan.outputs.crate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        continue-on-error: true
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          VIA: ${{ steps.auth.outputs.token && 'trusted publishing' || 'stored token' }}
        run: |
          echo "publishing with $VIA"
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::no crates.io token: set up trusted publishing for this workflow, or add CARGO_REGISTRY_TOKEN to the crates-io environment"
            exit 1
          fi
          cargo publish --locked

  # @zeroonething/replysieve, the library as WebAssembly, with provenance.
  # npm 11.5.1 or newer uses trusted publishing (OIDC) when it is set up for
  # this workflow on npmjs.com, and otherwise the NPM_TOKEN secret of the npm
  # environment. The environment deploys only from main. wasm-bindgen-cli must
  # match the wasm-bindgen crate exactly, so its version comes from Cargo.lock.
  npm:
    needs: [plan, test]
    if: needs.plan.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli at the Cargo.lock version
        run: |
          version=$(grep -A1 -x 'name = "wasm-bindgen"' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "wasm-bindgen $version"
          test -n "$version"
          cargo install wasm-bindgen-cli --locked --version "$version"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.1
      - run: cargo build --locked
      - run: npm ci
        working-directory: npm
      - run: npm run build
        working-directory: npm
      - run: npm test
        working-directory: npm
      - run: npm publish --provenance --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # One image per architecture on its own native runner, pushed as
  # <version>-<arch>, then joined into one multi-arch tag below.
  image:
    needs: [plan, test]
    if: needs.plan.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Build, check and push
        env:
          TAG: ${{ env.IMAGE }}:${{ needs.plan.outputs.version }}-${{ matrix.arch }}
          VERSION: ${{ needs.plan.outputs.version }}
          REF: ${{ needs.plan.outputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker build --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$REF" -t "$TAG" .
          printed=$(docker run --rm "$TAG" --version)
          echo "$printed"
          test "$printed" = "replysieve $VERSION"
          test "$(docker image inspect -f '{{.Architecture}}' "$TAG")" = "${{ matrix.arch }}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$TAG"

  # Joins the architectures under the version tag, then points latest (only
  # when this is the highest release) and the minor tag at it, in that order.
  # When the version tag already exists, only the moving tags are fixed up.
  manifest:
    needs: [plan, image]
    if: >-
      always() && needs.plan.result == 'success'
      && (needs.image.result == 'success'
          || (needs.image.result == 'skipped' && needs.plan.outputs.retag == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag the image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MINOR: ${{ needs.plan.outputs.minor }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          BUILT: ${{ needs.image.result == 'success' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [[ "$BUILT" == true ]]; then
            docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          fi
          if [[ "$PRERELEASE" == false ]]; then
            # Computed now, not in plan, so a rerun never moves latest back.
            highest=$( { git tag -l 'v[0-9]*' | grep -vF -e - | sed 's/^v//' || true; echo "$VERSION"; } | sort -V | tail -1)
            if [[ "$highest" == "$VERSION" ]]; then
              docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
            fi
            docker buildx imagetools create -t "$IMAGE:$MINOR" "$IMAGE:$VERSION"
          fi
          docker buildx imagetools inspect "$IMAGE:$VERSION" | tee manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt
