name: ci

# Every branch, every pull request. No job reads a secret, so a pull request
# from a fork runs exactly what a branch in this repository runs.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same ref makes the older run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  # The model is a mocked server (wiremock); no key, no network.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - run: cargo test --locked

  # Licences, advisories, bans and sources against deny.toml. No cache on
  # purpose: the advisory database is fetched fresh, so a new advisory fails
  # the next push.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check

  # No credential in the tree: the default gitleaks rules plus one for
  # crates.io tokens (.gitleaks.toml). The binary, checked against its digest.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks over the tree
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --exit-code 1'

  # What `cargo install replysieve` does, from this checkout: build, put the
  # binary on PATH, run it. `check "hi"` is rejected by the offline precheck
  # (too_short) before any model call, so it needs no key and no network.
  install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo install --path . --locked
      - run: replysieve --version
      - name: Offline check is a reject verdict
        run: |
          out=$(env -u OPENROUTER_API_KEY replysieve check "hi")
          echo "$out"
          jq -e '.verdict == "reject"' <<< "$out" > /dev/null

  # What crates.io would receive. The file list is printed so it is reviewed
  # in the log, then the full packaging and verification build runs.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - run: cargo package --locked --list
      - run: cargo publish --dry-run --locked

  # The image the release publishes: built from this checkout, then run the
  # way a user runs it. The key is a dummy: /healthz and the too_short
  # precheck answer before any model call, so nothing leaves the runner.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker build -t replysieve:ci .
      - name: Under 50 MB and runs as nonroot
        run: |
          size=$(docker image inspect -f '{{.Size}}' replysieve:ci)
          user=$(docker image inspect -f '{{.Config.User}}' replysieve:ci)
          echo "size=$size user=$user"
          test "$size" -lt 50000000
          test "$user" = "65532:65532"
      - name: No shell in the image
        run: |
          rc=0
          docker run --rm --entrypoint sh replysieve:ci -c true || rc=$?
          echo "exit $rc"
          test "$rc" = 127
      - name: Start the server
        run: |
          docker run -d --name replysieve -p 127.0.0.1:8080:8080 \
            -e OPENROUTER_API_KEY=dummy -e REPLYSIEVE_TOKEN=ci-token replysieve:ci
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          exit 1
      - name: Health, auth and an offline check
        run: |
          curl -fsS http://127.0.0.1:8080/healthz | jq -e '.status == "ok"'
          status() {
            curl -s -o /dev/null -w '%{http_code}' "$@" \
              -H 'Content-Type: application/json' -d '{"text":"hi"}' \
              http://127.0.0.1:8080/v1/check
          }
          test "$(status)" = 401
          test "$(status --oauth2-bearer wrong)" = 401
          curl -fsS --oauth2-bearer ci-token \
            -H 'Content-Type: application/json' -d '{"text":"hi"}' \
            http://127.0.0.1:8080/v1/check \
            | jq -e '.verdict == "reject" and .reason == "too_short"'
      - if: failure()
        run: docker logs replysieve || true
